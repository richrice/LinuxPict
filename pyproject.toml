[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LinuxPict"
version = "1.0.0"
description = "Capture, annotate, and hand screenshots to an AI agent on Linux"
requires-python = ">=3.10"

[project.scripts]
linuxpict = "linuxpict.app:main"

[tool.setuptools]
packages = ["linuxpict"]
